# All MySQL env comes from this Secret, pulled from the central store by External Secrets.
# Nothing sensitive is committed to git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-credentials
  namespace: mysql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets          # replace with your store
  target:
    name: mysql-credentials
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef: { key: mysql/source, property: rootPassword }   # replace with your path
    - secretKey: MYSQL_DATABASE
      remoteRef: { key: mysql/source, property: database }
    - secretKey: MYSQL_USER
      remoteRef: { key: mysql/source, property: user }
    - secretKey: MYSQL_PASSWORD
      remoteRef: { key: mysql/source, property: password }
