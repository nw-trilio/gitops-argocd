apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql-source
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nw-trilio/gitops-argocd.git
    targetRevision: main
    path: mysql/manifests
  destination:
    name: source-cluster
    namespace: mysql
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
