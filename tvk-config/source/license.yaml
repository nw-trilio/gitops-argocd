# TVK License for the source cluster. The key is secret, so git holds only a placeholder.
# Set the real key in the cluster (see README, "License"); tvk-config-source ignores spec.key,
# so Argo CD never overwrites it with the placeholder.
apiVersion: triliovault.trilio.io/v1
kind: License
metadata:
  name: tvk-license
  namespace: trilio-system   # same namespace as the TVK install (TrilioVaultManager)
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # before the Target
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  key: REPLACE_IN_CLUSTER   # never commit the real key
