# No backupPlanComponents: the whole mysql namespace is backed up.
apiVersion: triliovault.trilio.io/v1
kind: BackupPlan
metadata:
  name: mysql
  namespace: mysql
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  backupConfig:
    target:
      name: nfs-target
      namespace: mysql
    retentionPolicy:
      name: keep-7
      namespace: mysql
    schedulePolicy:
      fullBackupPolicy:
        name: daily
        namespace: mysql
