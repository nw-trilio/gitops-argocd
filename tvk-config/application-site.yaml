apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tvk-config-site
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/nw-trilio/gitops-argocd.git
    targetRevision: main
    path: tvk-config/site
    directory:
      recurse: true
  destination:
    name: site-cluster
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # set prune: true once trusted
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 10   # keeps retrying while the operator, CRDs and webhooks come up
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
